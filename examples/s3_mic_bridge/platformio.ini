; Standalone PlatformIO project for the ESP32-S3-N16R8 microphone bridge.
; Run from this folder:
;   platformio run -e hosyond-s3-n16r8-mic
;   platformio run -e hosyond-s3-n16r8-mic -t upload
;   platformio device monitor -b 115200

[platformio]
src_dir = src
boards_dir = ../../boards

[env:hosyond-s3-n16r8-mic]
platform = espressif32@6.9.0
board = Hosyond-S3-N16R8
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
    default
build_flags =
    ; This Hosyond board enumerates as a WCH USB serial adapter, so keep
    ; Arduino Serial on UART0 instead of native USB CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
